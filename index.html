<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06090f">
  <title>Jelly Rabbit Studio</title>
  <meta name="description" content="JellyRabbit — ten luminous studies of Saussurea medusa, an alpine woolly plant.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=medusa-surface-1">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=wave-c-1">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png?v=wave-c-1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=wave-c-1">
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/favicon.svg?v=wave-c-1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=wave-c-1">
  <style>
    .playback-controls{position:fixed;z-index:5;right:max(28px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:3px;padding:4px;border:1px solid #293440;border-radius:28px;background:rgba(6,9,15,.78);backdrop-filter:blur(12px)}
    .playback-controls button,.playback-controls #motion-toggle[hidden]{position:static;display:grid!important;place-items:center;width:44px;height:44px;border:0;border-radius:50%;color:#9daebb;touch-action:manipulation}
    .playback-controls button:hover{color:#f3f0e9;background:#ffffff0a}
    .playback-controls button:disabled{opacity:.4;cursor:wait}
    .playback-controls button[aria-pressed="true"]{background:#ddd2f01a;color:#e9dff8}
    .playback-controls svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .playback-controls #motion-toggle,.playback-controls #motion-toggle[hidden]{position:relative;inset:auto;margin:0;font-size:0}
    .playback-controls #motion-toggle::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:15px;border-left:4px solid currentColor;border-right:4px solid currentColor}
    .playback-controls #motion-toggle[aria-pressed="true"]::before{width:0;height:0;border:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor;margin-left:1px}
    .control-divider{height:16px;width:1px;background:#293440;margin:0 3px}
    .music-status{position:absolute;right:8px;bottom:calc(100% + 10px);margin:0;white-space:nowrap;color:#9daebb;font-size:11px}
    @media(max-width:600px){.playback-controls{right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <main class="hero">
    <div class="particle-stage" role="img" aria-label="Colored particles cycle through ten lifelike Saussurea medusa alpine plants.">
      <canvas id="particles" aria-hidden="true"></canvas>
    </div>
    <h1 class="wordmark">JellyRabbit</h1>
    <div class="playback-controls" role="group" aria-label="Sound and motion">
      <button id="music-mute" type="button" aria-label="Unmute music" aria-pressed="true" title="Unmute music">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path id="music-waves" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
      <span class="control-divider" aria-hidden="true"></span>
      <button id="motion-toggle" type="button" aria-label="Pause animation and music" aria-pressed="false" title="Pause animation and music" disabled>Ⅱ</button>
      <p id="music-status" class="music-status" role="status" aria-live="polite"></p>
    </div>
    <audio id="soundtrack" preload="none" loop muted></audio>
  </main>
  <script src="assets/js/hero.js?v=medusa-surface-1" defer></script>
  <script>
(() => {
  'use strict';
  // Floating in Zero Gravity — MeditativeTiger, Pixabay Content License:
  // https://pixabay.com/music/meditationspiritual-floating-in-zero-gravity-363225/
  const source = 'https://cdn.pixabay.com/audio/2025/06/21/audio_742bf5e258.mp3';
  const audio = document.getElementById('soundtrack');
  const mute = document.getElementById('music-mute');
  const motion = document.getElementById('motion-toggle');
  const waves = document.getElementById('music-waves');
  const status = document.getElementById('music-status');
  let muted = true;
  let started = false;
  let request = 0;
  let pending = false;
  audio.volume = 0.45;
  audio.muted = true;
  const paused = () => motion.getAttribute('aria-pressed') === 'true';
  const allowed = () => !paused() && !document.hidden;
  const updateMute = () => {
    mute.setAttribute('aria-pressed', String(muted));
    mute.setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music');
    mute.title = muted ? 'Unmute music' : 'Mute music';
    waves.setAttribute('d', muted ? 'm16 9 6 6m0-6-6 6' : 'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14');
  };
  const syncAudio = async () => {
    const ready = document.documentElement.classList.contains('webgl-ready');
    motion.disabled = !ready;
    const label = paused() ? 'Resume animation and music' : 'Pause animation and music';
    // The renderer owns this button's paused state; both controls read that
    // same state, including reduced-motion and hidden-tab changes.
    if (motion.getAttribute('aria-label') !== label) motion.setAttribute('aria-label', label);
    motion.title = label;
    if (!allowed()) {
      ++request;
      pending = false;
      audio.pause();
      status.textContent = '';
      return;
    }
    if (!started || pending || !audio.paused) return;
    const token = ++request;
    pending = true;
    status.textContent = muted ? '' : 'Loading…';
    try {
      await audio.play();
      if (token !== request) return;
      pending = false;
      status.textContent = '';
    } catch (error) {
      if (token !== request) return;
      pending = false;
      muted = true;
      audio.muted = true;
      updateMute();
      status.textContent = 'Tap sound to retry';
    }
  };
  mute.addEventListener('click', () => {
    muted = !muted;
    audio.muted = muted;
    updateMute();
    if (!muted && audio.error) audio.load();
    if (!muted && !started) {
      audio.src = source;
      audio.load();
      started = true;
    }
    if (muted) status.textContent = '';
    syncAudio();
  });
  // Observe the existing renderer control instead of maintaining a second
  // animation clock or restarting the morph sequence on resume.
  const observer = new MutationObserver(syncAudio);
  observer.observe(motion, {attributes:true, attributeFilter:['aria-pressed']});
  observer.observe(document.documentElement, {attributes:true, attributeFilter:['class']});
  document.addEventListener('visibilitychange', syncAudio);
  audio.addEventListener('playing', () => { status.textContent = ''; });
  audio.addEventListener('waiting', () => {
    if (allowed() && !muted) status.textContent = 'Loading…';
  });
  audio.addEventListener('error', () => {
    ++request;
    pending = false;
    muted = true;
    audio.muted = true;
    updateMute();
    status.textContent = 'Tap sound to retry';
  });
  syncAudio();
})();
  </script>
</body>
</html>
