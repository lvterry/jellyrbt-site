</head>
<body>
  <main class="hero">
    <div class="particle-stage" role="img" aria-label="Colored particles cycle through ten lifelike Saussurea medusa alpine plants.">
      <canvas id="particles" aria-hidden="true"></canvas>
    </div>
    <div class="spotlights" aria-hidden="true">
      <div class="corner-lettering" lang="zh-Hans">
        <span>水</span>
        <span>母</span>
        <span>雪</span>
        <span>兔</span>
      </div>
    </div>
    <h1 class="wordmark">JellyRabbit</h1>
    <div class="playback-controls" role="group" aria-label="Sound and motion">
      <button id="music-mute" type="button" aria-label="Unmute music" aria-pressed="true" title="Unmute music">
        <svg class="icon-muted" width="20" height="20" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm101.66-61.3a8,8,0,0,1-11.32,11.32L216,139.31l-18.34,18.35a8,8,0,0,1-11.32-11.32L204.69,128l-18.35-18.34a8,8,0,0,1,11.32-11.32L216,116.69l18.34-18.35a8,8,0,0,1,11.32,11.32L227.31,128Z"/></svg><svg class="icon-sound" width="20" height="20" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"/></svg>
      </button>
      <span class="control-divider" aria-hidden="true"></span>
      <button id="motion-toggle" type="button" aria-label="Pause animation and music" aria-pressed="false" title="Pause animation and music" disabled><svg class="icon-pause" width="20" height="20" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M200,32H160a16,16,0,0,0-16,16V208a16,16,0,0,0,16,16h40a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm0,176H160V48h40ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Zm0,176H56V48H96Z"/></svg><svg class="icon-play" width="20" height="20" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg></button>
      <p id="music-status" class="music-status" role="status" aria-live="polite"></p>
    </div>
    <audio id="soundtrack" preload="none" loop muted></audio>
  </main>
  <script src="assets/js/hero.js?v=corner-spotlight-2" defer></script>
  <script>
(() => {
  'use strict';
  // Floating in Zero Gravity — MeditativeTiger, Pixabay Content License:
  // https://pixabay.com/music/meditationspiritual-floating-in-zero-gravity-363225/
  const source = 'https://cdn.pixabay.com/audio/2025/06/21/audio_742bf5e258.mp3';
  const audio = document.getElementById('soundtrack');
  const mute = document.getElementById('music-mute');
  const motion = document.getElementById('motion-toggle');
  const status = document.getElementById('music-status');
  let muted = true;
  let started = false;
  let request = 0;
  let pending = false;
  audio.volume = 0.45;
  audio.muted = true;
  const paused = () => motion.getAttribute('aria-pressed') === 'true';
  const allowed = () => !paused() && !document.hidden;
  const updateMute = () => {
    mute.setAttribute('aria-pressed', String(muted));
    mute.setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music');
    mute.title = muted ? 'Unmute music' : 'Mute music';
  };
  const syncAudio = async () => {
    const ready = document.documentElement.classList.contains('webgl-ready');
    motion.disabled = !ready;
    const label = paused() ? 'Resume animation and music' : 'Pause animation and music';
    // The renderer owns this button's paused state; both controls read that
    // same state, including reduced-motion and hidden-tab changes.
    if (motion.getAttribute('aria-label') !== label) motion.setAttribute('aria-label', label);
    motion.title = label;
    if (!allowed()) {
      ++request;
      pending = false;
      audio.pause();
      status.textContent = '';
      return;
    }
    if (!started || pending || !audio.paused) return;
    const token = ++request;
    pending = true;
    status.textContent = muted ? '' : 'Loading…';
    try {
      await audio.play();
      if (token !== request) return;
      pending = false;
      status.textContent = '';
    } catch (error) {
      if (token !== request) return;
      pending = false;
      muted = true;
      audio.muted = true;
      updateMute();
      status.textContent = 'Tap sound to retry';
    }
  };
  mute.addEventListener('click', () => {
    muted = !muted;
    audio.muted = muted;
    updateMute();
    if (!muted && audio.error) audio.load();
    if (!muted && !started) {
      audio.src = source;
      audio.load();
      started = true;
    }
    if (muted) status.textContent = '';
    syncAudio();
  });
  // Observe the existing renderer control instead of maintaining a second
  // animation clock or restarting the morph sequence on resume.
  const observer = new MutationObserver(syncAudio);
  observer.observe(motion, {attributes:true, attributeFilter:['aria-pressed']});
  observer.observe(document.documentElement, {attributes:true, attributeFilter:['class']});
  document.addEventListener('visibilitychange', syncAudio);
  audio.addEventListener('playing', () => { status.textContent = ''; });
  audio.addEventListener('waiting', () => {
    if (allowed() && !muted) status.textContent = 'Loading…';
  });
  audio.addEventListener('error', () => {
    ++request;
    pending = false;
    muted = true;
    audio.muted = true;
    updateMute();
    status.textContent = 'Tap sound to retry';
  });
  syncAudio();
})();
  </script>
</body>
</html>
